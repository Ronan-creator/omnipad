name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Omnipad -c Release

      - name: Version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version comes from Omnipad/Properties/AssemblyInfo.cs. A push to main with a version that has
          # no release yet publishes one (tag v<version>), so shipping an update = bump the version and push.
          $v = [regex]::Match((Get-Content Omnipad/Properties/AssemblyInfo.cs -Raw), 'AssemblyVersion\("(\d+\.\d+\.\d+)').Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $publish = ($LASTEXITCODE -ne 0) -and ("${{ github.event_name }}" -eq "push") -and ("${{ github.ref }}" -eq "refs/heads/main")
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, publish: $publish"
          exit 0  # "gh release view" fails when there's no release yet; that's expected

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Omnipad | Out-Null
          Copy-Item Omnipad/bin/Release/net48/* dist/Omnipad -Exclude *.pdb
          Copy-Item LICENSE, README.md dist/Omnipad
          Compress-Archive dist/Omnipad "Omnipad-${{ steps.ver.outputs.version }}.zip"

      - name: Build installer
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe -OutFile installer/ViGEmBus_Setup.exe
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          $v = "${{ steps.ver.outputs.version }}"
          & $nsis "-DVERSION=$v" "-DSRC=..\Omnipad\bin\Release\net48" "-DVIGEM=ViGEmBus_Setup.exe" "installer/omnipad.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Copy-Item "installer/Omnipad-Setup-${{ steps.ver.outputs.version }}.exe" Omnipad-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: omnipad
          path: |
            Omnipad-*.zip
            Omnipad-Setup.exe

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Omnipad ${{ steps.ver.outputs.version }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            Omnipad-*.zip
            Omnipad-Setup.exe
