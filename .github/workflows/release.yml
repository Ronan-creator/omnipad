name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Omnipad -c Release

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart('v') } else { $v = "0.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Omnipad | Out-Null
          Copy-Item Omnipad/bin/Release/net48/* dist/Omnipad -Exclude *.pdb
          Copy-Item LICENSE, README.md dist/Omnipad
          Compress-Archive dist/Omnipad "Omnipad-${{ steps.ver.outputs.version }}.zip"

      - name: Build installer
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe -OutFile installer/ViGEmBus_Setup.exe
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $nsis -DVERSION=${{ steps.ver.outputs.version }} -DSRC=..\Omnipad\bin\Release\net48 -DVIGEM=ViGEmBus_Setup.exe installer/omnipad.nsi
          Copy-Item "installer/Omnipad-Setup-${{ steps.ver.outputs.version }}.exe" Omnipad-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: omnipad
          path: |
            Omnipad-*.zip
            Omnipad-Setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Omnipad ${{ steps.ver.outputs.version }}
          files: |
            Omnipad-*.zip
            Omnipad-Setup.exe
